<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings - FlyRank</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Settings</h1>

      <form id="settingsForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required minlength="3" />
          <span class="error" data-for="username"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
          <span class="error" data-for="email"></span>
        </div>

        <div class="field">
          <label for="updateInterval">Update interval (minutes)</label>
          <input id="updateInterval" name="updateInterval" type="number" min="1" max="1440" value="60" required />
          <span class="error" data-for="updateInterval"></span>
        </div>

        <div class="field checkbox">
          <label>
            <input id="enableNotifications" name="enableNotifications" type="checkbox" />
            Enable notifications
          </label>
        </div>

        <div class="actions">
          <button type="submit">Save</button>
          <button type="button" id="resetBtn">Reset</button>
        </div>

        <div id="status" class="status" aria-live="polite"></div>
      </form>
    </main>

    <script src="app.js"></script>
  </body>
</html>
